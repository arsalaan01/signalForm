<div class="min-h-screen bg-gray-100 p-6">
  <div class="mx-auto max-w-7xl">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">
        Users
      </h1>
      <p class="mt-2 text-sm text-gray-600">
        User information loaded from JSONPlaceholder.
      </p>
    </div>

    <div
      class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    >
    
      @for (user of users; track user.id) {
        <div
          class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-gray-200 transition hover:-translate-y-1 hover:shadow-lg"
        >
          <div class="mb-5 flex items-center gap-4">
            <div
              class="flex h-12 w-12 items-center justify-center rounded-full bg-indigo-100 text-lg font-bold text-indigo-700"
            >
              {{ user.name.charAt(0) }}
            </div>

            <div class="min-w-0">
              <h2 class="truncate text-lg font-semibold text-gray-900">
                {{ user.name }}
              </h2>

              <p class="truncate text-sm text-gray-500">
                {{ user.username }}
              </p>
            </div>
          </div>

          <div class="space-y-3 text-sm">
            <div>
              <p class="font-medium text-gray-500">
                Email
              </p>
              <p class="break-all text-gray-800">
                {{ user.email }}
              </p>
            </div>

            <div>
              <p class="font-medium text-gray-500">
                Phone
              </p>
              <p class="text-gray-800">
                {{ user.phone }}
              </p>
            </div>

            <div>
              <p class="font-medium text-gray-500">
                Website
              </p>
              <p class="break-all text-indigo-600">
                {{ user.website }}
              </p>
            </div>
          </div>

          <div class="mt-6 border-t border-gray-100 pt-4">
            <button
              class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
              
            >
              View Details
            </button>
          </div>
        </div>
      } @empty {
        <div
          class="col-span-full rounded-xl bg-white p-10 text-center shadow-sm"
        >
          <p class="text-gray-500">
            No users found.
          </p>
        </div>
      }
    </div>
  </div>
</div>
