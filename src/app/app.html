<header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-900/95 backdrop-blur-md">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3.5 sm:px-6 lg:px-8">
    
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 font-bold text-white shadow-md shadow-indigo-500/20">
        P
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">
        Project Portal
      </h1>
    </div>

    <!-- Navigation Links -->
    <nav class="flex items-center gap-1.5 sm:gap-2">
      <a 
        routerLink="/" 
        routerLinkActive="bg-indigo-600 text-white shadow-sm" 
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3.5 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white">
        Home
      </a>

      <a 
        routerLink="/projects" 
        routerLinkActive="bg-indigo-600 text-white shadow-sm" 
        class="rounded-lg px-3.5 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white">
        Projects
      </a>

      <a 
        routerLink="/employees" 
        routerLinkActive="bg-indigo-600 text-white shadow-sm" 
        class="rounded-lg px-3.5 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white">
        Employees
      </a>
    </nav>

  </div>
</header>

<!-- Main Content Area -->
<main class="mx-auto min-h-[calc(100vh-65px)] max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <router-outlet />
</main>
